[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qhop-training"
version = "0.1.0"
requires-python = ">=3.10.1,<=3.10.12"
dependencies = [
  "numpy==1.23.5",
  "torch==2.3.1",
  "onnx==1.15.0",
  "tensorboard==2.14.1",
  "protobuf==3.20.3",
  "grpcio==1.53.2",
  "gym==0.26.2",
  "pettingzoo==1.15.0",
  "onnxruntime==1.18.1",
  "psutil==5.9.8",
  "mlagents-envs @ git+https://github.com/Unity-Technologies/ml-agents.git@release_23_tag#subdirectory=ml-agents-envs",
]

[project.scripts]
qhop-train = "qhop_train.cli:main"

[tool.setuptools.packages.find]
where = ["."]
